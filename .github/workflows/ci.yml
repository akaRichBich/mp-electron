name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so a generated rule fails fast and legibly.
      - name: types
        run: pnpm typecheck
      - name: core stays platform-free
        run: pnpm check:arch
      - name: unit tests
        run: pnpm test
      - name: rule evals
        run: pnpm eval
      - name: the PWA still builds
        run: pnpm build:web

      # Scoped to branches the spec pipeline creates: a *generated rule* never
      # needs a dependency. An engineer adding a shell obviously may.
      - name: no new dependencies on rule branches
        if: startsWith(github.head_ref || github.ref_name, 'rule/')
        run: |
          base="${{ github.base_ref || 'main' }}"
          git fetch origin "$base" --depth=1
          if git diff --name-only "origin/$base...HEAD" | grep -qE '(^|/)package\.json$|pnpm-lock\.yaml'; then
            echo "This rule branch changes dependencies. That needs a human."
            exit 1
          fi
